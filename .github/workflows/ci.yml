name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # gitleaks 8.30.1, checksum from the release's gitleaks_8.30.1_checksums.txt.
      - run: |
          curl -sSfL -o gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
      - run: ./gitleaks git . --redact --no-banner
  bun-svelte:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.17.0'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.0'
      # bun.lock is committed; keep it in sync with workspace changes.
      - run: bun install
      - run: bun run lint:web
      - run: bun run format:check:web
      # Vocal Fix tests generate and probe small audio files with ffmpeg/ffprobe.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: bun run test
      - run: bun run check
      - run: bun run build
  python-audio-prototypes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements-dev.txt
      - run: python -m ruff check apps tests
      - run: python -m ruff format --check apps tests
      - run: python -m mypy
      - run: pytest -q
  audio-engine:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/audio-engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      # Base and dev only: no torch or model code; the tests use a fake sine-wave backend.
      - run: pip install -r requirements-base.txt -r requirements-dev.txt
      - run: python -m pytest -q
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m mypy
