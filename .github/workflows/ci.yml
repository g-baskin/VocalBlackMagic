name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  bun-svelte:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.17.0'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.0'
      # The generated bun.lock must be committed after the first verified install.
      - run: bun install
      - run: bun run lint:web
      - run: bun run format:check:web
      - run: bun test packages
      - run: bun run check
      - run: bun run build
  python-audio-prototypes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements-dev.txt
      - run: python -m ruff check apps tests
      - run: python -m ruff format --check apps tests
      - run: python -m mypy
      - run: pytest -q
